{{- if and (has .Values.render.part (list "all" "runtime")) (eq .Values.workload "deployment") -}}
{{- $root := . -}}
{{- $name := include "mitis.service.name" . -}}
{{- $canary := eq .Values.updates.strategy "canary" -}}
{{- $services := list $name -}}
{{- if $canary -}}{{ $services = append $services (printf "%s-candidate" $name) }}{{- end -}}
{{- if .Values.ports -}}
{{- range $service := $services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service }}
  labels:
    {{- include "mitis.service.labels" $root | nindent 4 }}
  annotations:
    {{- include "mitis.service.wave" (dict "root" $root "wave" 0) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mitis.service.selector" $root | nindent 4 }}
  ports:
    {{- range $portName, $port := $root.Values.ports }}
    - name: {{ $portName }}
      port: {{ if kindIs "map" $port }}{{ $port.listen }}{{ else if eq $portName "http" }}80{{ else }}{{ $port }}{{ end }}
      targetPort: {{ $portName }}
      protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
{{- with .Values.http }}
{{- $hostname := include "mitis.service.value" (dict "root" $root "value" (dict "url" (dict "hostname" (.hostname | default "") "subdomain" (.subdomain | default $name)))) | trimPrefix "https://" -}}
{{- $hosts := prepend (.aliases | default list) $hostname -}}
{{- $portName := .port | default "http" -}}
{{- $port := index $root.Values.ports $portName -}}
{{- $listen := $port -}}
{{- if kindIs "map" $port -}}{{ $listen = $port.listen }}{{- else if eq $portName "http" -}}{{ $listen = 80 }}{{- end }}
---
{{- if eq $root.Values.render.routing "gateway" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "mitis.service.labels" $root | nindent 4 }}
  annotations:
    {{- include "mitis.service.wave" (dict "root" $root "wave" 0) | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .exposure }}
      sectionName: https
  hostnames: {{ toJson $hosts }}
  rules:
    - matches:
        {{- range .paths | default (list "/") }}
        - path: {type: PathPrefix, value: {{ . | quote }}}
        {{- end }}
      backendRefs:
        - name: {{ $name }}
          port: {{ $listen }}
          weight: 100
        {{- if $canary }}
        - name: {{ $name }}-candidate
          port: {{ $listen }}
          weight: 0
        {{- end }}
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "mitis.service.labels" $root | nindent 4 }}
  annotations:
    {{- include "mitis.service.wave" (dict "root" $root "wave" 0) | nindent 4 }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    {{- with .healthcheck }}
    {{- with .path }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ . | quote }}
    {{- end }}
    {{- with .successCodes }}
    alb.ingress.kubernetes.io/success-codes: {{ join "," . | quote }}
    {{- end }}
    {{- end }}
    external-dns.alpha.kubernetes.io/hostname: {{ join "," $hosts | quote }}
spec:
  ingressClassName: {{ $root.Release.Namespace }}-{{ .exposure }}
  rules:
    {{- range $host := $hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $.Values.http.paths | default (list "/") }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port: {number: {{ $listen }}}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
