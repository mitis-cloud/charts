{{- $root := . -}}
{{- range $unitName, $unit := .Values.releaseUnits }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: {{ $unitName }}
  namespace: {{ $root.Values.project }}
spec:
  vars:
    - name: environment
  steps:
    - uses: git-clone
      config:
        repoURL: {{ $root.Values.git.repository | quote }}
        checkout:
          - branch: {{ $root.Values.git.revision | quote }}
            path: ./repo
    {{- range $serviceName, $service := $unit.services }}
    - uses: yaml-update
      config:
        path: ./repo/{{ $root.Values.git.environments }}/{{ "${{ vars.environment }}" }}/{{ $serviceName }}.yaml
        updates:
          {{- range $key, $image := $service.images }}
          - key: {{ $key | quote }}
            value: {{ printf "${{ imageFrom(%q, warehouse(%q)).Digest }}" $image $unitName | quote }}
          {{- end }}
    {{- end }}
    - uses: git-commit
      config:
        path: ./repo
        message: Promote {{ $unitName }} to {{ "${{ vars.environment }}" }}
    - uses: git-push
      as: push
      config:
        path: ./repo
    - uses: argocd-update
      retry: {timeout: 15m}
      config:
        apps:
          - name: {{ $root.Values.project }}-{{ $unitName }}-{{ "${{ vars.environment }}" }}
            # No desiredRevision: every environment tracks the shared branch, so pinning the pushed
            # commit would mark other environments unhealthy after any later commit.
            namespace: {{ $root.Values.argoNamespace }}
    - uses: argocd-wait
      retry: {timeout: 15m}
      config:
        apps:
          - name: {{ $root.Values.project }}-{{ $unitName }}-{{ "${{ vars.environment }}" }}
            namespace: {{ $root.Values.argoNamespace }}
{{- end }}
