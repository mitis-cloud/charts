{{- include "mitis.delivery.validate" . -}}
{{- $root := . -}}
{{- range $unitName, $unit := .Values.releaseUnits }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $root.Values.project }}-{{ $unitName }}
  namespace: {{ $root.Values.argoNamespace }}
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          {{- range $envName, $env := $root.Values.environments }}
          {{- if has $unitName ($env.units | default (keys $root.Values.releaseUnits)) }}
          - environment: {{ $envName }}
            cluster: {{ $env.cluster | quote }}
            namespace: {{ $env.namespace }}
            routing: {{ $env.routing | default "gateway" }}
            charts: {{ toJson $env.charts }}
            layers: {{ toJson ($env.layers | default list) }}
            externallyScaled: {{ $env.externallyScaled | default false }}
          {{- end }}
          {{- end }}
  # Sources live in the patch: each environment inserts its own layers between the service and its overrides.
  templatePatch: |
    spec:
      sources:
        {{- range $serviceName, $service := $unit.services }}
        {{- $chart := index $root.Values.charts $service.chart }}
        - repoURL: {{ $chart.repository | quote }}
          chart: {{ $chart.name }}
          targetRevision: '{{ printf "{{ index .charts %q }}" $service.chart }}'
          helm:
            releaseName: {{ $service.releaseName | default $serviceName }}
            valueFiles:
              - $values/{{ $root.Values.git.services }}/{{ $serviceName }}.yaml
              {{- /* Shared values speak the service chart's vocabulary: other charts get only their own files. */}}
              {{- if has "" ($chart.serviceScopes | default list) }}
              {{ "{{- range .layers }}" }}
              - $values/{{ "{{ . }}" }}
              {{ "{{- end }}" }}
              - $values/{{ $root.Values.git.environments }}/{{ "{{ .environment }}" }}/defaults.yaml
              {{- end }}
              - $values/{{ $root.Values.git.environments }}/{{ "{{ .environment }}" }}/{{ $serviceName }}.yaml
            ignoreMissingValueFiles: false
            {{- with $chart.serviceScopes }}
            parameters:
              {{- range $scope := . }}
              {{- $prefix := ternary (printf "%s." $scope) "" (ne $scope "") }}
              - name: {{ $prefix }}render.engine
                value: argo
              - name: {{ $prefix }}render.part
                value: all
              - name: {{ $prefix }}render.routing
                value: '{{ "{{ .routing }}" }}'
              - name: {{ $prefix }}render.order
                value: {{ $service.order | default 0 | quote }}
              {{ "{{- if .externallyScaled }}" }}
              - name: {{ $prefix }}render.capacity
                value: external
              {{ "{{- end }}" }}
              {{- end }}
            {{- end }}
        {{- end }}
        - repoURL: {{ $root.Values.git.repository | quote }}
          targetRevision: {{ $root.Values.git.revision | quote }}
          ref: values
      # Lives in the patch so environments can add their own entries.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers: [/spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from]
        - group: argoproj.io
          kind: Rollout
          jsonPointers: [/spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from]
        - group: ''
          kind: Service
          jsonPointers: [/spec/selector/rollouts-pod-template-hash]
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers: [/metadata/labels/rollouts.argoproj.io~1gatewayapi-canary]
          jqPathExpressions: ['.spec.rules[].backendRefs[].weight']
        {{- range $service := $unit.services }}
        {{- range $target := $service.capacityTargets }}
        - group: {{ ternary "apps" "argoproj.io" (eq $target.kind "Deployment") }}
          kind: {{ $target.kind }}
          name: {{ $target.name }}
          namespace: '{{ "{{ .namespace }}" }}'
          jsonPointers:
            - /spec/replicas
            - /metadata/annotations/understudy.sh~1base-replicas
            - /metadata/annotations/understudy.sh~1target-revision
        {{- end }}
        {{- end }}
        {{ "{{- if .externallyScaled }}" }}
        # Replica counts belong to the environment's scaler (for example scheduled downscaling), not to Git.
        {{- range $kind := list "Deployment" "StatefulSet" }}
        - group: apps
          kind: {{ $kind }}
          jsonPointers: [/spec/replicas]
        {{- end }}
        - group: argoproj.io
          kind: Rollout
          jsonPointers: [/spec/replicas]
        {{ "{{- end }}" }}
  template:
    metadata:
      name: '{{ $root.Values.project }}-{{ $unitName }}-{{ "{{ .environment }}" }}'
      {{- if include "mitis.delivery.promoted" $unit }}
      annotations:
        kargo.akuity.io/authorized-stage: '{{ $root.Values.project }}:{{ "{{ .environment }}" }}'
      {{- end }}
    spec:
      project: '{{ $root.Values.project }}-{{ "{{ .environment }}" }}'
      destination:
        name: '{{ "{{ .cluster }}" }}'
        namespace: '{{ "{{ .namespace }}" }}'
      syncPolicy:
        {{- if not (include "mitis.delivery.promoted" $unit) }}
        automated: {prune: true, selfHeal: true}
        {{- end }}
        syncOptions: [RespectIgnoreDifferences=true]
        retry:
          limit: 3
          backoff: {duration: 5s, factor: 2, maxDuration: 1m}
{{- end }}
{{- range $envName, $env := .Values.environments }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $root.Values.project }}-{{ $envName }}
  namespace: {{ $root.Values.argoNamespace }}
  annotations:
    # Applications are rejected until their project exists.
    argocd.argoproj.io/sync-wave: '-10'
spec:
  sourceRepos:
    - {{ $root.Values.git.repository | quote }}
    {{- $repositories := list }}
    {{- range $chart := $root.Values.charts }}{{ $repositories = append $repositories $chart.repository }}{{ end }}
    {{- range $repository := $repositories | uniq | sortAlpha }}
    - {{ $repository | quote }}
    {{- end }}
  destinations:
    - name: {{ $env.cluster | quote }}
      namespace: {{ $env.namespace }}
  namespaceResourceWhitelist:
    - {group: '*', kind: '*'}
  {{- if hasKey $env "environment" }}
  clusterResourceWhitelist:
    - {group: mitis.cloud, kind: Environment}
  {{- else }}
  clusterResourceWhitelist: []
  {{- end }}
{{- with $env.environment }}
{{- $chart := index $root.Values.charts "environment" }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $root.Values.project }}-{{ $envName }}-environment
  namespace: {{ $root.Values.argoNamespace }}
spec:
  project: {{ $root.Values.project }}-{{ $envName }}
  destination:
    name: {{ $env.cluster | quote }}
    namespace: {{ $env.namespace }}
  source:
    repoURL: {{ $chart.repository | quote }}
    chart: {{ $chart.name }}
    targetRevision: {{ index $env.charts "environment" | quote }}
    helm:
      releaseName: environment
      valuesObject: {{ toJson (merge (dict "namespace" $env.namespace) .) }}
  # Configuration, not a promoted release: Git changes such as maintenance apply directly.
  syncPolicy:
    automated: {prune: true, selfHeal: true}
{{- end }}
{{- end }}
