{{- $root := . -}}
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: {{ .Values.project }}
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: {{ .Values.project }}
  namespace: {{ .Values.project }}
spec:
  promotionPolicies:
    {{- range $envName, $env := .Values.environments }}
    {{- if include "mitis.delivery.promotedUnits" (dict "root" $root "env" $env) | fromJsonArray }}
    - stageSelector: {name: {{ $envName }}}
      autoPromotionEnabled: {{ eq ($env.promotion | default "manual") "automatic" }}
    {{- end }}
    {{- end }}
{{- /* One Warehouse per project: each Freight is the project's complete set of images. */}}
{{- $repos := dict }}
{{- range $unitName, $unit := .Values.releaseUnits }}
{{- range $service := $unit.services }}
{{- range $image := $service.images }}
{{- if not (hasKey $repos $image) }}{{ $_ := set $repos $image ($unit.allowTags | default $root.Values.discovery.allowTags) }}{{ end }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Git repositories whose files promote into values, by branch. */}}
{{- $sources := dict }}
{{- range $unit := .Values.releaseUnits }}
{{- range $service := $unit.services }}
{{- range $value := $service.gitValues }}
{{- $_ := set $sources $value.repository ($value.branch | default "main") }}
{{- end }}
{{- end }}
{{- end }}
{{- if or $repos $sources }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: {{ .Values.project }}
  namespace: {{ .Values.project }}
spec:
  interval: {{ .Values.discovery.interval }}
  subscriptions:
    {{- range $image := keys $repos | sortAlpha }}
    - image:
        repoURL: {{ $image | quote }}
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes: [{{ index $repos $image | quote }}]
        discoveryLimit: {{ $root.Values.discovery.limit }}
    {{- end }}
    {{- range $repository := keys $sources | sortAlpha }}
    - git:
        repoURL: {{ $repository | quote }}
        branch: {{ index $sources $repository | quote }}
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: {{ $root.Values.discovery.limit }}
    {{- end }}
  {{- with $root.Values.discovery.criteria }}
  freightCreationCriteria:
    expression: {{ . | quote }}
  {{- end }}
{{- end }}
{{- range $envName, $env := .Values.environments }}
{{- $promoted := include "mitis.delivery.promotedUnits" (dict "root" $root "env" $env) | fromJsonArray }}
{{- if $promoted }}
{{- $color := "" }}
{{- range $rule := $root.Values.stageColors }}
{{- if and (not $color) (regexMatch $rule.match $envName) }}{{ $color = $rule.color }}{{ end }}
{{- end }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: {{ $envName }}
  namespace: {{ $root.Values.project }}
  {{- with $color }}
  annotations:
    kargo.akuity.io/color: {{ . | quote }}
  {{- end }}
spec:
  requestedFreight:
    - origin: {kind: Warehouse, name: {{ $root.Values.project }}}
      sources:
        {{- if $env.upstream }}
        stages: {{ toJson $env.upstream }}
        {{- else }}
        direct: true
        {{- end }}
  {{- /* Repositories this environment's promoted units read values from, checked out at the Freight's commit. */}}
  {{- $checkouts := dict }}
  {{- range $unitName := $promoted }}
  {{- range $service := (index $root.Values.releaseUnits $unitName).services }}
  {{- range $value := $service.gitValues }}{{ $_ := set $checkouts $value.repository true }}{{ end }}
  {{- end }}
  {{- end }}
  {{- $checkoutPaths := dict }}
  {{- range $i, $repository := keys $checkouts | sortAlpha }}{{ $_ := set $checkoutPaths $repository (printf "./sources/%d" $i) }}{{ end }}
  promotionTemplate:
    spec:
      {{- with $env.vars }}
      vars:
        {{- range $name := keys . | sortAlpha }}
        - name: {{ $name }}
          value: {{ index $env.vars $name | quote }}
        {{- end }}
      {{- end }}
      steps:
        - uses: git-clone
          config:
            repoURL: {{ $root.Values.git.repository | quote }}
            checkout:
              - branch: {{ $root.Values.git.revision | quote }}
                path: ./repo
        {{- range $repository := keys $checkoutPaths | sortAlpha }}
        - uses: git-clone
          config:
            repoURL: {{ $repository | quote }}
            checkout:
              - commit: {{ printf "${{ commitFrom(%q, warehouse(%q)).ID }}" $repository $root.Values.project | quote }}
                path: {{ index $checkoutPaths $repository }}
        {{- end }}
        {{- range $unitName := $promoted }}
        {{- range $serviceName, $service := (index $root.Values.releaseUnits $unitName).services }}
        {{- with $service.gitValues }}
        {{- $written := dict }}
        {{- range $key := keys . | sortAlpha }}
        {{- $value := index $service.gitValues $key }}
        {{- $alias := printf "read-%s-%s" $serviceName (lower $key) }}
        - uses: {{ ternary "json-parse" "yaml-parse" (hasSuffix ".json" $value.path) }}
          as: {{ $alias }}
          config:
            path: {{ printf "%s/%s" (index $checkoutPaths $value.repository) $value.path | quote }}
            outputs:
              - name: value
                fromExpression: {{ $value.expression | default "$env" | quote }}
        {{- $_ := set $written $key (printf "outputs[%q].value" $alias) }}
        {{- end }}
        {{- /* Image digests go into the same document: yaml-update cannot create keys the rewrite removed. */}}
        {{- range $path, $image := $service.images }}
        {{- $node := $written }}
        {{- $keys := splitList "." $path }}
        {{- range $part := initial $keys }}
        {{- if not (hasKey $node $part) }}{{ $_ := set $node $part (dict) }}{{ end }}
        {{- $node = index $node $part }}
        {{- end }}
        {{- $_ := set $node (last $keys) (printf "imageFrom(%q, warehouse(%q)).Digest" $image $root.Values.project) }}
        {{- end }}
        {{- /* The service owns its environment file: rewritten whole, so keys removed at the source disappear. */}}
        - uses: file-write
          config:
            path: ./repo/{{ $root.Values.git.environments }}/{{ $envName }}/{{ $serviceName }}.yaml
            contents: {{ printf "# Written by promotion from the source repository; edit the source instead.\n${{ asYAML(%s) }}" (include "mitis.delivery.exprMap" $written) | quote }}
            overwrite: true
        {{- end }}
        {{- end }}
        {{- end }}
        {{- range $unitName := $promoted }}
        {{- range $serviceName, $service := (index $root.Values.releaseUnits $unitName).services }}
        {{- if not $service.gitValues }}
        {{- with $service.images }}
        - uses: yaml-update
          config:
            path: ./repo/{{ $root.Values.git.environments }}/{{ $envName }}/{{ $serviceName }}.yaml
            updates:
              {{- range $key, $image := . }}
              - key: {{ $key | quote }}
                value: {{ printf "${{ imageFrom(%q, warehouse(%q)).Digest }}" $image $root.Values.project | quote }}
              {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        - uses: git-commit
          config:
            path: ./repo
            message: Promote {{ $root.Values.project }} to {{ $envName }}
        - uses: git-push
          config:
            path: ./repo
        # No desiredRevision: every environment tracks the shared branch, so pinning the pushed
        # commit would mark other environments unhealthy after any later commit.
        - uses: argocd-update
          retry: {timeout: 15m}
          config:
            apps:
              {{- range $unitName := $promoted }}
              - name: {{ $root.Values.project }}-{{ $unitName }}-{{ $envName }}
                namespace: {{ $root.Values.argoNamespace }}
              {{- end }}
        - uses: argocd-wait
          retry: {timeout: 15m}
          config:
            apps:
              {{- range $unitName := $promoted }}
              - name: {{ $root.Values.project }}-{{ $unitName }}-{{ $envName }}
                namespace: {{ $root.Values.argoNamespace }}
              {{- end }}
{{- end }}
{{- end }}
