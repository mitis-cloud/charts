{{- include "mitis.delivery.validate" . -}}
{{- $root := . -}}
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: {{ .Values.project }}
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: {{ .Values.project }}
  namespace: {{ .Values.project }}
spec:
  promotionPolicies:
    {{- range $envName, $env := .Values.environments }}
    {{- if include "mitis.delivery.promotedUnits" (dict "root" $root "env" $env) | fromJsonArray }}
    - stageSelector: {name: {{ $envName }}}
      autoPromotionEnabled: {{ eq ($env.promotion | default "manual") "automatic" }}
    {{- end }}
    {{- end }}
{{- /* One Warehouse per promoted release unit: each Freight is one unit's images and Git sources. */}}
{{- range $unitName, $unit := .Values.releaseUnits }}
{{- if include "mitis.delivery.promoted" $unit }}
{{- $repos := dict }}
{{- $sources := dict }}
{{- range $service := $unit.services }}
{{- range $image := $service.images }}{{ $_ := set $repos $image true }}{{ end }}
{{- range $value := $service.gitValues }}{{ $_ := set $sources $value.repository ($value.branch | default "main") }}{{ end }}
{{- end }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: {{ $unitName }}
  namespace: {{ $root.Values.project }}
spec:
  interval: {{ $root.Values.discovery.interval }}
  subscriptions:
    {{- range $image := keys $repos | sortAlpha }}
    - image:
        repoURL: {{ $image | quote }}
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes: [{{ $unit.allowTags | default $root.Values.discovery.allowTags | quote }}]
        discoveryLimit: {{ $root.Values.discovery.limit }}
    {{- end }}
    {{- range $repository := keys $sources | sortAlpha }}
    - git:
        repoURL: {{ $repository | quote }}
        branch: {{ index $sources $repository | quote }}
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: {{ $root.Values.discovery.limit }}
    {{- end }}
  {{- with $unit.criteria }}
  freightCreationCriteria:
    expression: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- range $envName, $env := .Values.environments }}
{{- $promoted := include "mitis.delivery.promotedUnits" (dict "root" $root "env" $env) | fromJsonArray }}
{{- if $promoted }}
{{- $color := "" }}
{{- range $rule := $root.Values.stageColors }}
{{- if and (not $color) (regexMatch $rule.match $envName) }}{{ $color = $rule.color }}{{ end }}
{{- end }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: {{ $envName }}
  namespace: {{ $root.Values.project }}
  {{- with $color }}
  annotations:
    kargo.akuity.io/color: {{ . | quote }}
  {{- end }}
spec:
  {{- /* One slot per unit the environment runs: a promotion moves one unit's Freight. */}}
  requestedFreight:
    {{- range $unitName := $promoted }}
    - origin: {kind: Warehouse, name: {{ $unitName }}}
      sources:
        {{- if $env.upstream }}
        stages: {{ toJson $env.upstream }}
        {{- else }}
        direct: true
        {{- end }}
    {{- end }}
  promotionTemplate:
    spec:
      {{- with $env.vars }}
      vars:
        {{- range $name := keys . | sortAlpha }}
        - name: {{ $name }}
          value: {{ index $env.vars $name | quote }}
        {{- end }}
      {{- end }}
      steps:
        - uses: git-clone
          config:
            repoURL: {{ $root.Values.git.repository | quote }}
            checkout:
              - branch: {{ $root.Values.git.revision | quote }}
                path: ./repo
        {{- range $unitName := $promoted }}
        {{- $services := include "mitis.delivery.services" (dict "root" $root "env" $env "unit" $unitName) | fromJson }}
        {{- $when := printf "${{ ctx.targetFreight.origin.name == %q }}" $unitName }}
        {{- /* Repositories the unit reads values from, checked out at its Freight's commit. */}}
        {{- $checkouts := dict }}
        {{- range $service := $services }}{{ range $value := $service.gitValues }}{{ $_ := set $checkouts $value.repository true }}{{ end }}{{ end }}
        {{- $checkoutPaths := dict }}
        {{- range $i, $repository := keys $checkouts | sortAlpha }}{{ $_ := set $checkoutPaths $repository (printf "./sources/%s-%d" $unitName $i) }}{{ end }}
        {{- range $repository := keys $checkoutPaths | sortAlpha }}
        - uses: git-clone
          if: {{ $when | quote }}
          config:
            repoURL: {{ $repository | quote }}
            checkout:
              - commit: {{ printf "${{ commitFrom(%q, warehouse(%q)).ID }}" $repository $unitName | quote }}
                path: {{ index $checkoutPaths $repository }}
        {{- end }}
        {{- range $serviceName, $service := $services }}
        {{- if $service.gitValues }}
        {{- $written := dict }}
        {{- range $key := keys $service.gitValues | sortAlpha }}
        {{- $value := index $service.gitValues $key }}
        {{- $alias := printf "read-%s-%s" $serviceName (lower $key) }}
        - uses: {{ ternary "json-parse" "yaml-parse" (hasSuffix ".json" $value.path) }}
          as: {{ $alias }}
          if: {{ $when | quote }}
          config:
            path: {{ printf "%s/%s" (index $checkoutPaths $value.repository) $value.path | quote }}
            outputs:
              - name: value
                fromExpression: {{ $value.expression | default "$env" | quote }}
        {{- $_ := set $written $key (printf "outputs[%q].value" $alias) }}
        {{- end }}
        {{- /* Image digests go into the same document: yaml-update cannot create keys the rewrite removed. */}}
        {{- range $path, $image := $service.images }}
        {{- $node := $written }}
        {{- $keys := splitList "." $path }}
        {{- range $part := initial $keys }}
        {{- if not (hasKey $node $part) }}{{ $_ := set $node $part (dict) }}{{ end }}
        {{- $node = index $node $part }}
        {{- end }}
        {{- $_ := set $node (last $keys) (printf "imageFrom(%q, warehouse(%q)).Digest" $image $unitName) }}
        {{- end }}
        {{- /* The service owns its environment file: rewritten whole, so keys removed at the source disappear. */}}
        - uses: file-write
          if: {{ $when | quote }}
          config:
            path: ./repo/{{ $root.Values.git.environments }}/{{ $envName }}/{{ $serviceName }}.yaml
            {{- /* Exactly one asYAML() expression: Kargo unquotes its result only when nothing surrounds it. */}}
            contents: {{ printf "${{ asYAML(%s) }}" (include "mitis.delivery.exprMap" $written) | quote }}
            overwrite: true
        {{- else }}
        {{- with $service.images }}
        - uses: yaml-update
          if: {{ $when | quote }}
          config:
            path: ./repo/{{ $root.Values.git.environments }}/{{ $envName }}/{{ $serviceName }}.yaml
            updates:
              {{- range $key, $image := . }}
              - key: {{ $key | quote }}
                value: {{ printf "${{ imageFrom(%q, warehouse(%q)).Digest }}" $image $unitName | quote }}
              {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        - uses: git-commit
          config:
            path: ./repo
            message: {{ printf "Promote ${{ ctx.targetFreight.origin.name }} to %s" $envName | quote }}
        - uses: git-push
          config:
            path: ./repo
        {{- range $unitName := $promoted }}
        {{- $when := printf "${{ ctx.targetFreight.origin.name == %q }}" $unitName }}
        # No desiredRevision: every environment tracks the shared branch, so pinning the pushed
        # commit would mark other environments unhealthy after any later commit.
        - uses: argocd-update
          if: {{ $when | quote }}
          retry: {timeout: 15m}
          config:
            apps:
              - name: {{ $root.Values.project }}-{{ $unitName }}-{{ $envName }}
                namespace: {{ $root.Values.argoNamespace }}
        - uses: argocd-wait
          if: {{ $when | quote }}
          retry: {timeout: 15m}
          config:
            apps:
              - name: {{ $root.Values.project }}-{{ $unitName }}-{{ $envName }}
                namespace: {{ $root.Values.argoNamespace }}
        {{- end }}
{{- end }}
{{- end }}
