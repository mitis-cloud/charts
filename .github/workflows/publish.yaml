name: Publish chart
on:
  push:
    tags: ['service-v*', 'delivery-v*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
      - name: Validate source and package
        run: |
          python -m pip install -r requirements-test.txt
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          make check package
      - name: Publish immutable version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          chart="${TAG%-v*}"
          version="${TAG#*-v}"
          case "$chart" in service|delivery) ;; *) exit 1 ;; esac
          test "$(helm show chart "dist/$chart-$version.tgz" | python -c 'import sys,yaml; print(yaml.safe_load(sys.stdin)["version"])')" = "$version"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if gh api --paginate "orgs/mitis-cloud/packages/container/charts%2F$chart/versions" > .cache/versions.json 2> .cache/package-error; then
            if jq -e --arg version "$version" '.[] | select(.metadata.container.tags | index($version))' .cache/versions.json; then
              echo "Version already exists: $chart:$version"
              exit 1
            fi
          elif ! grep -q 'HTTP 404' .cache/package-error; then
            cat .cache/package-error
            exit 1
          fi
          helm push "dist/$chart-$version.tgz" oci://ghcr.io/mitis-cloud/charts
          helm pull "oci://ghcr.io/mitis-cloud/charts/$chart" --version "$version" --destination .cache
          cmp "dist/$chart-$version.tgz" ".cache/$chart-$version.tgz"
