apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: webapps.mitis.cloud
spec:
  group: mitis.cloud
  names:
    kind: Webapp
    plural: webapps
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: A web application served over HTTPS through a CDN, from object storage (its build uploaded separately) or from an existing origin.
              required: [hostname]
              x-kubernetes-validations:
                - rule: "self.mode == 'origin' ? has(self.origin) : has(self.outputs)"
                  message: Origin mode needs origin; the other modes need outputs.
              properties:
                hostname:
                  type: string
                  description: Public hostname, inside a DNS zone the platform manages.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: A webapp cannot change hostname.
                mode:
                  type: string
                  description: application routes every non-file path to the single-page application, answers maintenance and caches only cachedPaths; files serves stored files as they are, all cached, and ignores maintenance; origin caches everything from origin and ignores maintenance.
                  enum: [application, files, origin]
                  default: application
                cachedPaths:
                  type: array
                  description: Path patterns served with long-lived caching; everything else is never cached (application mode).
                  default: ["/assets/*"]
                  items: {type: string}
                maintenance:
                  type: object
                  description: While enabled, every request answers 503 with the body.
                  properties:
                    enabled: {type: boolean, default: false}
                    body: {type: string, default: Service under maintenance.}
                origin:
                  type: object
                  description: The existing HTTPS origin served in origin mode. It must only answer requests carrying the secret header.
                  required: [hostname, secretRef]
                  properties:
                    hostname: {type: string, description: Origin hostname, whose certificate the origin presents.}
                    secretRef:
                      type: object
                      description: Secret in this namespace holding the secret header value.
                      required: [name, key]
                      properties:
                        name: {type: string}
                        key: {type: string}
                outputs:
                  type: object
                  description: Where the storage and CDN identifiers that upload tooling needs are published.
                  required: [store, key]
                  properties:
                    store: {type: string, description: ClusterSecretStore receiving the values.}
                    key: {type: string, description: Remote key prefix; values are <key>-website-bucket-id and <key>-cloudfront-website-id.}
