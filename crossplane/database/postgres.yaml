apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: databases.postgres.mitis.cloud
spec:
  compositeTypeRef:
    apiVersion: mitis.cloud/v1alpha1
    kind: Database
  mode: Pipeline
  pipeline:
    - step: platform
      functionRef:
        name: crossplane-contrib-function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: mitis-platform
    - step: render
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $spec := $xr.spec }}
            {{- $db := $spec.name }}
            {{- $kubeDb := $db | lower | replace "_" "-" }}
            {{- $pg := (index .context "apiextensions.crossplane.io/environment").postgres }}
            {{- $groups := dict "admin" (printf "%s-group-admin" $db) "operator" (printf "%s-group-operator" $db) "reader" (printf "%s-group-reader" $db) }}
            {{- $schemas := merge (deepCopy ($spec.schemas | default dict)) (dict "public" (dict "operator" "full" "reader" "read-execute")) }}
            {{- $none := dict "schema" list "table" list "sequence" list "function" list }}
            {{- $access := dict
                "full" (dict "schema" (list "USAGE") "table" (list "SELECT" "INSERT" "UPDATE" "DELETE" "TRUNCATE") "sequence" (list "USAGE" "SELECT" "UPDATE") "function" (list "EXECUTE"))
                "read" (dict "schema" (list "USAGE") "table" (list "SELECT") "sequence" (list "USAGE" "SELECT") "function" list)
                "read-execute" (dict "schema" (list "USAGE") "table" (list "SELECT") "sequence" (list "USAGE" "SELECT") "function" (list "EXECUTE"))
                "none" $none }}
            {{- $adminTable := list "INSERT" "SELECT" "UPDATE" "DELETE" "TRUNCATE" "REFERENCES" "TRIGGER" }}
            {{- $adminAccess := dict "schema" (list "USAGE" "CREATE") "table" $adminTable "sequence" (list "USAGE" "SELECT" "UPDATE") "function" (list "EXECUTE") }}
            {{- /* Nothing is dropped or revoked by Crossplane: the database outlives its composite, and its roles own it. */}}
            {{- $keep := list "Observe" "Create" "Update" "LateInitialize" }}
            {{- $mrs := list }}

            {{- range $group, $role := $groups }}
            {{- $mrs = append $mrs (dict "kind" "Role" "id" (printf "group-%s" $group) "external" $role "forProvider" (dict "privileges" (dict "login" false))) }}
            {{- end }}
            {{- /* A managed instance's admin is not a superuser: owning objects on the group's behalf needs membership. */}}
            {{- $mrs = append $mrs (dict "kind" "Grant" "id" "provider-membership" "forProvider" (dict "role" $pg.adminRole "memberOf" $groups.admin)) }}
            {{- $mrs = append $mrs (dict "kind" "Database" "id" "database" "external" $db "forProvider" (dict "owner" $groups.admin "lcCollate" "C" "lcCType" "C" "template" "template0" "connectionLimit" -1 "allowConnections" true)) }}
            {{- range $extension := $spec.extensions }}
            {{- $mrs = append $mrs (dict "kind" "Extension" "id" (printf "extension-%s" $extension) "forProvider" (dict "database" $db "extension" $extension)) }}
            {{- end }}

            {{- $mrs = append $mrs (dict "kind" "Grant" "id" "database-admin" "forProvider" (dict "database" $db "role" $groups.admin "privileges" (list "CONNECT" "CREATE" "TEMPORARY") "revokePublicOnDb" true)) }}
            {{- $mrs = append $mrs (dict "kind" "Grant" "id" "database-operator" "forProvider" (dict "database" $db "role" $groups.operator "privileges" (list "CONNECT" "TEMPORARY"))) }}
            {{- $mrs = append $mrs (dict "kind" "Grant" "id" "database-reader" "forProvider" (dict "database" $db "role" $groups.reader "privileges" (list "CONNECT"))) }}

            {{- $owners := dict "group-admin" $groups.admin }}
            {{- range $account, $group := $spec.accounts }}
            {{- if eq $group "admin" }}
            {{- $_ := set $owners $account (printf "%s-%s" $db $account) }}
            {{- /* Setting default privileges for an account's future objects needs membership too. */}}
            {{- $mrs = append $mrs (dict "kind" "Grant" "id" (printf "provider-membership-%s" $account) "forProvider" (dict "role" $pg.adminRole "memberOf" (printf "%s-%s" $db $account))) }}
            {{- end }}
            {{- end }}

            {{- range $schema, $cfg := $schemas }}
            {{- /* PUBLIC cannot connect (revokePublicOnDb), so no schema-level revoke is needed. */}}
            {{- if ne $schema "public" }}
            {{- $mrs = append $mrs (dict "kind" "Schema" "id" (printf "schema-%s" $schema) "external" $schema "forProvider" (dict "database" $db "role" $groups.admin)) }}
            {{- end }}
            {{- $functions := ternary true $cfg.existingFunctions (not (hasKey $cfg "existingFunctions")) }}
            {{- $levels := dict "admin" $adminAccess "operator" (index $access $cfg.operator) "reader" (index $access $cfg.reader) }}
            {{- range $group, $level := $levels }}
            {{- $table := $level.table }}
            {{- if and (eq $group "admin") $cfg.adminMaintain }}{{ $table = append $table "MAINTAIN" }}{{ end }}
            {{- $role := index $groups $group }}
            {{- if $level.schema }}{{ $mrs = append $mrs (dict "kind" "Grant" "id" (printf "%s-%s-schema" $schema $group) "forProvider" (dict "database" $db "schema" $schema "role" $role "privileges" $level.schema)) }}{{ end }}
            {{- if $table }}{{ $mrs = append $mrs (dict "kind" "Grant" "id" (printf "%s-%s-table" $schema $group) "forProvider" (dict "database" $db "schema" $schema "role" $role "tables" (list "*") "privileges" $table)) }}{{ end }}
            {{- if $level.sequence }}{{ $mrs = append $mrs (dict "kind" "Grant" "id" (printf "%s-%s-sequence" $schema $group) "forProvider" (dict "database" $db "schema" $schema "role" $role "sequences" (list "*") "privileges" $level.sequence)) }}{{ end }}
            {{- if and $level.function $functions }}{{ $mrs = append $mrs (dict "kind" "Grant" "id" (printf "%s-%s-function" $schema $group) "forProvider" (dict "database" $db "schema" $schema "role" $role "routines" (list (dict "name" "*")) "privileges" $level.function)) }}{{ end }}
            {{- range $owner, $ownerRole := $owners }}
            {{- range $type := list "table" "sequence" "function" }}
            {{- $privileges := index $level $type }}
            {{- if $privileges }}{{ $mrs = append $mrs (dict "kind" "DefaultPrivileges" "id" (printf "%s-%s-%s-%s" $schema $owner $group $type) "forProvider" (dict "database" $db "schema" $schema "targetRole" $ownerRole "role" $role "objectType" $type "privileges" $privileges)) }}{{ end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- range $account, $group := $spec.accounts }}
            {{- $role := printf "%s-%s" $db $account }}
            {{- $accountResource := printf "%s-%s" $kubeDb $account | lower | replace "_" "-" }}
            {{- $forProvider := dict "privileges" (dict "login" true) "passwordSecretRef" (dict "name" $accountResource "key" "password") }}
            {{- /* Admin accounts act as the admin group, so the group owns what they create. */}}
            {{- if eq $group "admin" }}{{ $_ := set $forProvider "configurationParameters" (list (dict "name" "role" "value" $groups.admin)) }}{{ end }}
            {{- $mrs = append $mrs (dict "kind" "Role" "id" (printf "account-%s" $account) "external" $role "forProvider" $forProvider) }}
            {{- $mrs = append $mrs (dict "kind" "Grant" "id" (printf "account-%s-membership" $account) "forProvider" (dict "role" $role "memberOf" (index $groups $group))) }}
            {{- $remote := printf "%s-%s" $spec.secrets.key $account }}
            ---
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: Password
            metadata:
              name: {{ $accountResource }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: account-{{ $account }}-generator
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              length: 33
              symbols: 0
              allowRepeat: true
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: {{ $accountResource }}-generated
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: account-{{ $account }}-generated
            spec:
              refreshPolicy: CreatedOnce
              target:
                name: {{ $accountResource }}-generated
              dataFrom:
                - sourceRef:
                    generatorRef:
                      apiVersion: generators.external-secrets.io/v1alpha1
                      kind: Password
                      name: {{ $accountResource }}
            ---
            # Publishes a generated password only where none exists, so adopted accounts keep theirs.
            apiVersion: external-secrets.io/v1alpha1
            kind: PushSecret
            metadata:
              name: {{ $accountResource }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: account-{{ $account }}-publish
            spec:
              updatePolicy: IfNotExists
              secretStoreRefs:
                - kind: ClusterSecretStore
                  name: {{ $spec.secrets.store }}
              selector:
                secret:
                  name: {{ $accountResource }}-generated
              template:
                mergePolicy: Merge
                data:
                  url: '{{ $role }}:{{ "{{ .password }}" }}@{{ $pg.host }}:{{ $pg.port }}/{{ $db }}'
              data:
                {{- range $key := list "password" "url" }}
                - match:
                    secretKey: {{ $key }}
                    remoteRef:
                      remoteKey: {{ $remote }}-{{ $key }}
                  metadata:
                    apiVersion: kubernetes.external-secrets.io/v1alpha1
                    kind: PushSecretMetadata
                    spec:
                      secretType: SecureString
                {{- end }}
            ---
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: {{ $accountResource }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: account-{{ $account }}-credentials
            spec:
              refreshInterval: 1h
              secretStoreRef:
                kind: ClusterSecretStore
                name: {{ $spec.secrets.store }}
              target:
                name: {{ $accountResource }}
                template:
                  mergePolicy: Merge
                  data:
                    username: {{ $role }}
              data:
                {{- range $key := list "password" "url" }}
                - secretKey: {{ $key }}
                  remoteRef:
                    key: {{ $remote }}-{{ $key }}
                {{- end }}
            {{- end }}

            {{- range $mr := $mrs }}
            ---
            apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
            kind: {{ $mr.kind }}
            metadata:
              {{- $id := $mr.id | lower | replace "_" "-" }}
              name: {{ $kubeDb }}-{{ $id }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $id }}
                {{- with $mr.external }}
                crossplane.io/external-name: {{ . }}
                {{- end }}
            spec:
              managementPolicies: {{ toJson $keep }}
              providerConfigRef:
                kind: ClusterProviderConfig
                name: {{ $pg.providerConfig }}
              forProvider: {{ toJson $mr.forProvider }}
            {{- end }}
    - step: ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
