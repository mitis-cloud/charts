apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: workloadidentities.mitis.cloud
spec:
  group: mitis.cloud
  names:
    kind: WorkloadIdentity
    plural: workloadidentities
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [serviceAccounts, storage]
              properties:
                serviceAccounts:
                  type: array
                  minItems: 1
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    maxLength: 63
                    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                storage:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, access]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        description: ObjectStorage in this namespace, or a platform storage catalog entry when external is true.
                      external:
                        type: boolean
                        default: false
                      access:
                        type: string
                        enum: [read, readWrite]
                allowNodeAssumption:
                  type: boolean
                  default: false
                  description: Also permit the platform's worker identities to assume this identity for engines using instance credentials.
                listStorage:
                  type: boolean
                  default: false
                  description: Allow storage discovery across the account for engines that enumerate buckets.
                tags:
                  type: object
                  additionalProperties: {type: string}
            status:
              type: object
              properties:
                id: {type: string}
