apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: environments.mitis.cloud
spec:
  group: mitis.cloud
  names:
    kind: Environment
    plural: environments
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: A deployment environment and the cluster-scoped resources its services share.
              required: [namespace]
              x-kubernetes-validations:
                - rule: '!has(self.maintenance) || !self.maintenance.enabled || ''public'' in self.exposures'
                  message: Maintenance answers on the public exposure, which the environment must bind.
                - rule: '(!has(self.databases) || size(self.databases) == 0) || has(self.secrets)'
                  message: Databases keep their credentials in the environment's secret store.
                - rule: '(!has(self.webapps) || size(self.webapps) == 0) || has(self.secrets)'
                  message: Webapps publish their identifiers to the environment's secret store.
              properties:
                namespace:
                  type: string
                  description: Application namespace the environment owns.
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: An environment cannot move to another namespace.
                exposures:
                  type: array
                  description: Exposure profiles services in the namespace may select with http.exposure.
                  default: [public, private]
                  items:
                    type: string
                    enum: [public, private]
                  x-kubernetes-list-type: set
                isolation:
                  type: object
                  description: Restricts outbound traffic to the namespace itself, cluster DNS, the internet and the listed ports on platform private networks.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    privatePorts:
                      type: array
                      description: TCP ports reachable on platform private networks, such as a database.
                      items:
                        type: integer
                        minimum: 1
                        maximum: 65535
                      x-kubernetes-list-type: set
                secrets:
                  type: object
                  description: The secret store holding the environment's values, and the values generated for it. A value is generated and published only when its remote key does not exist yet.
                  required: [store, prefix]
                  properties:
                    store:
                      type: string
                      description: ClusterSecretStore holding the values.
                    prefix:
                      type: string
                      description: Remote key prefix for every value of the environment.
                    generated:
                      type: object
                      description: Values by remote key suffix.
                      additionalProperties:
                        type: object
                        required: [type]
                        x-kubernetes-validations:
                          - rule: self.type != 'string' || has(self.length)
                            message: A string needs a length.
                          - rule: self.type != 'value' || has(self.value)
                            message: A value needs its content.
                        properties:
                          type:
                            type: string
                            description: password (with symbols), string (letters and digits), username (lowercase letters), manual (a placeholder a person replaces), or value (fixed content).
                            enum: [password, string, username, manual, value]
                          length:
                            type: integer
                            minimum: 8
                            maximum: 128
                          value:
                            type: string
                databases:
                  type: object
                  description: PostgreSQL databases on the platform's shared instance, named <namespace>-<key> unless name is set. Account credentials are kept under <prefix>pgsql-<key>-<account>-password and -url.
                  additionalProperties:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 40
                      extensions:
                        type: array
                        items: {type: string}
                      schemas:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      accounts:
                        type: object
                        additionalProperties:
                          type: string
                          enum: [admin, operator, reader]
                webapps:
                  type: object
                  description: Static web applications by name. They share the environment's maintenance switch and body, and publish their storage and CDN identifiers under <prefix><name>.
                  additionalProperties:
                    type: object
                    required: [hostname]
                    properties:
                      hostname: {type: string}
                      mode: {type: string, enum: [application, files]}
                      cachedPaths:
                        type: array
                        items: {type: string}
                maintenance:
                  type: object
                  description: While enabled, the listed public hostnames answer with a fixed response instead of reaching services.
                  x-kubernetes-validations:
                    - rule: '!self.enabled || size(self.hostnames) > 0'
                      message: Maintenance needs at least one hostname.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    hostnames:
                      type: array
                      items:
                        type: string
                        minLength: 1
                      x-kubernetes-list-type: set
                    status:
                      type: integer
                      default: 503
                      minimum: 200
                      maximum: 599
                    contentType:
                      type: string
                      default: text/plain
                      enum: [text/plain, text/css, text/html, application/javascript, application/json]
                    body:
                      type: string
                      default: Service under maintenance.
                      maxLength: 1024

                objectStorage:
                  type: object
                  additionalProperties:
                    type: object
                    required:
                    - name
                    properties:
                      name:
                        type: string
                        description: Stable bucket name used by application protocols.
                        minLength: 3
                        maxLength: 63
                        pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
                        x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: Storage cannot be renamed.
                      versioning:
                        type: boolean
                        default: true
                      expireAfterDays:
                        type: integer
                        minimum: 1
                        description: Delete current objects after this many days; omitted means no
                          expiry.
                      tags:
                        type: object
                        additionalProperties:
                          type: string

                identities:
                  type: object
                  additionalProperties:
                    type: object
                    required:
                    - serviceAccounts
                    - storage
                    properties:
                      serviceAccounts:
                        type: array
                        minItems: 1
                        x-kubernetes-list-type: set
                        items:
                          type: string
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      storage:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required:
                          - name
                          - access
                          properties:
                            name:
                              type: string
                              minLength: 1
                              description: ObjectStorage in this namespace, or a platform storage
                                catalog entry when external is true.
                            external:
                              type: boolean
                              default: false
                            access:
                              type: string
                              enum:
                              - read
                              - readWrite
                      allowNodeAssumption:
                        type: boolean
                        default: false
                        description: Also permit the platform's worker identities to assume this identity
                          for engines using instance credentials.
                      listStorage:
                        type: boolean
                        default: false
                        description: Allow storage discovery across the account for engines that enumerate
                          buckets.
                      tags:
                        type: object
                        additionalProperties:
                          type: string
