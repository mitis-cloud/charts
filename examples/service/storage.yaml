name: files
sharedStorage: efs-sc
image:
  repository: traefik/whoami
  tag: v1.12.0
capacity:
  instances: 1
ports:
  http: 80
storage:
  uploads:
    access: shared
  content:
    existing: shared-content
  work:
    temporary: true
    medium: memory
    sizeLimit: 64Mi
mounts:
  uploads: /uploads
  content: {path: /content, readOnly: true}
  work: /work
files:
  settings:
    path: /etc/example/settings.json
    content: '{"literal": "{{ do_not_evaluate_this }}"}'
environment:
  TOKEN: {ssm: example-token}
secretPrefix: test-
