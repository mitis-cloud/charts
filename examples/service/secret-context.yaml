workload: resources
facts:
  databaseHost: database.internal
secrets:
  database-config:
    templateContext:
      host: {fact: databaseHost}
      database: app
    values:
      password: database-password
    template:
      config.yaml: |
        host: {{ $context.host }}
        database: {{ $context.database }}
        password: {{ .password | printf "%q" }}
