project: example
git:
  repository: https://github.com/example/platform.git
environments:
  test:
    cluster: test
    namespace: example-test
    charts: {service: 0.1.0, environment: 0.1.0, proxy: 1.0.0, webapp: 0.1.0}
    promotion: automatic
    vars: {stage: test}
    layers: [stages/test.yaml]
    externallyScaled: true
    environment:
      maintenance:
        hostnames: [api.example-test.invalid]
  production:
    cluster: production
    namespace: example
    charts: {service: 0.1.0, proxy: 1.0.0, webapp: 0.1.0}
    upstream: [test]
    vars: {stage: production}
    promotion: manual
releaseUnits:
  backend:
    services:
      api:
        chart: service
        order: 1
        images: {image.digest: ghcr.io/example/backend}
        capacityTargets: [{name: api, kind: Rollout}]
      migrations:
        chart: service
        images: {image.digest: ghcr.io/example/database}
  worker:
    allowTags: '^[0-9a-f]{7}$'
    services:
      worker:
        chart: service
        images: {image.digest: ghcr.io/example/worker}
  site:
    allowTags: '^[0-9a-f]{7}$'
    # Freight pairs the site builds with the web commit their configuration comes from.
    criteria: imageFrom('ghcr.io/example/portal').Tag == commitFrom('https://github.com/example/web.git').ID[0:7]
    services:
      portal:
        chart: webapp
        images: {artifact.digest: ghcr.io/example/portal}
        gitValues:
          config: {repository: https://github.com/example/web.git, path: 'configs/${{ vars.stage }}/portal.json'}
      assets:
        chart: webapp
        images: {artifact.digest: ghcr.io/example/assets}
        gitValues:
          source: {repository: https://github.com/example/web.git, path: 'configs/${{ vars.stage }}/portal.json', expression: theme}
  edge:
    services:
      edge-proxy:
        chart: proxy
charts:
  proxy:
    repository: https://charts.example.invalid
    name: proxy
    serviceScopes: []
