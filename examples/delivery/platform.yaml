project: example
git:
  repository: https://github.com/example/platform.git
environments:
  test:
    cluster: test
    namespace: example-test
    charts: {service: 0.1.0, environment: 0.1.0, proxy: 1.0.0}
    promotion: automatic
    layers: [stages/test.yaml]
    externallyScaled: true
    environment:
      maintenance:
        hostnames: [api.example-test.invalid]
  production:
    cluster: production
    namespace: example
    charts: {service: 0.1.0, proxy: 1.0.0}
    upstream: [test]
    promotion: manual
releaseUnits:
  backend:
    services:
      api:
        chart: service
        order: 1
        images: {image.digest: ghcr.io/example/backend}
        capacityTargets: [{name: api, kind: Rollout}]
      migrations:
        chart: service
        images: {image.digest: ghcr.io/example/database}
  worker:
    allowTags: '^[0-9a-f]{7}$'
    services:
      worker:
        chart: service
        images: {image.digest: ghcr.io/example/backend}
  edge:
    services:
      edge-proxy:
        chart: proxy
charts:
  proxy:
    repository: https://charts.example.invalid
    name: proxy
    serviceScopes: []
