apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: mitis-platform
data:
  exposure:
    public:
      group: example-alb
      scheme: internet-facing
      attributes:
        routing.http.xff_header_processing.mode: remove
    private:
      group: example-alb-private
      scheme: internal
      inboundCIDRs: [192.0.2.0/24]
  exposureOverrides:
    guarded:
      public:
        group: guarded-alb
        wafAclArn: arn:aws:wafv2:eu-west-1:000000000000:regional/webacl/example/00000000-0000-0000-0000-000000000000
      private:
        group: guarded-alb-private
  privateNetworks: [198.51.100.0/24]
  region: eu-west-1
  cluster:
    name: example-cluster
  identity:
    oidcProvider: arn:aws:iam::000000000000:oidc-provider/oidc.eks.eu-west-1.amazonaws.com/id/EXAMPLE
    oidcIssuer: oidc.eks.eu-west-1.amazonaws.com/id/EXAMPLE
    nodeRoles:
      workers:
        name: example-workers
        arn: arn:aws:iam::000000000000:role/example-workers
  objectStorage:
    shared-input:
      id: arn:aws:s3:::shared-input
  artifacts:
    repositories: ['arn:aws:ecr:eu-west-1:000000000000:repository/portal-*']
  dns:
    zones:
      example.invalid: Z0000000000EXAMPLE
      app.example.invalid: Z0000000000NESTED
  postgres:
    providerConfig: postgres
    adminRole: platform_admin
    host: postgres.example.invalid
    port: 5432
