apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: mitis-platform
data:
  exposure:
    public:
      group: example-alb
      scheme: internet-facing
      attributes:
        routing.http.xff_header_processing.mode: remove
    private:
      group: example-alb-private
      scheme: internal
      inboundCIDRs: [192.0.2.0/24]
  privateNetworks: [198.51.100.0/24]
  region: eu-west-1
  cluster:
    name: example-cluster
  artifacts:
    repositories: ['arn:aws:ecr:eu-west-1:000000000000:repository/portal-*']
  dns:
    zones:
      example.invalid: Z0000000000EXAMPLE
      app.example.invalid: Z0000000000NESTED
  postgres:
    providerConfig: postgres
    adminRole: platform_admin
    host: postgres.example.invalid
    port: 5432
